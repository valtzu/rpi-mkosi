# dev: bring up networking and stream the journal to the build host from the
# initrd too, so a hang in cryptsetup/repart/growfs - before the rootfs's own
# journal-upload ever gets a chance to start - is still visible. Off by
# default: the initrd otherwise has no network stack at all, it doesn't need
# one to unlock/grow the local disk.
#
# systemd-networkd.service and systemd-journal-upload.service only declare
# WantedBy=multi-user.target, which the initrd never reaches (it boots
# through initrd.target) - each gets a WantedBy=sysinit.target [Install]
# drop-in so they start in parallel with cryptsetup/repart/growfs instead.
#
# The enabling preset itself has to live under initrd-preset/, not the usual
# system-preset/: systemd consults a completely separate preset directory
# whenever /etc/initrd-release is present (i.e. always, inside an initrd), and
# its own stock initrd-preset/90-systemd.preset unconditionally disables
# systemd-journal-upload.* - a rule in system-preset/ is never even read here.
[Content]
# systemd-networkd ships inside the systemd package on Debian, no extra
# package needed for it - just enable it (see the preset).
Packages=
    systemd-journal-remote
