# If rpi-fw-mock was requested (rd.modules_load=rpi-fw-mock), it is
# loaded by systemd-modules-load.service. rpi-crypto-passphrase's module init
# calls of_find_compatible_node()/rpi_firmware_get(), which the mock has to be
# intercepting by then - so order this template instance after modules-load.
# Harmless when the mock isn't in play.
[Unit]
After=systemd-modules-load.service
