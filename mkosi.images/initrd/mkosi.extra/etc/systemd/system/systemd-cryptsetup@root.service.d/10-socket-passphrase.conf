# gpt-auto generates systemd-cryptsetup@root.service with no key material. It
# does probe /run/cryptsetup-keys.d/root.key though, and follows an AF_UNIX
# socket found there - which is exactly what root-passphrase.socket listens on.
# All we need here is ordering: the daemon must have derived the passphrase and
# be accept()ing before this unit tries to unlock.
[Unit]
Requires=root-passphrase.service
After=root-passphrase.service
