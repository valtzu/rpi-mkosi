# gpt-auto generates systemd-cryptsetup@root.service with no key material, so
# it would fall back to an interactive console prompt on every boot past the
# first repart run. Feed it the derived passphrase from the same socket that
# serves systemd-repart; systemd-cryptsetup picks up the cryptsetup.passphrase
# credential automatically.
[Unit]
Wants=root-passphrase.socket
After=root-passphrase.socket

[Service]
LoadCredential=cryptsetup.passphrase:/run/root-passphrase.sock
