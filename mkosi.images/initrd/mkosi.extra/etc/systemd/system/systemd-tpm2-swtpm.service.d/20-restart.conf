# Under slow (e.g. cross-arch TCG-emulated) execution, swtpm can occasionally
# fail to respond to the kernel's first TPM command within the kernel's
# fixed command-duration timeout ("tpm tpm0: Operation Timed out" in dmesg),
# which kills this service (SWTPM_IO_Write: Input/output error). Nothing
# else retries it, so anything waiting on the resulting /dev/tpm0 /
# /dev/tpmrm0 device units then burns the full device timeout
# (systemd.default_device_timeout_sec) for no reason. Restart it quickly
# instead - manufacture_swtpm()'s marker-file logic (see
# test/units/TEST-92-TPM2-SWTPM.sh) already handles resuming after an
# interrupted/partial manufacture cleanly, so a fast restart is safe.
[Service]
Restart=on-failure
RestartSec=1s
