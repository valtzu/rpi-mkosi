# systemd-tpm2-generator normally adds this ordering itself, but we pull this
# service in statically (see systemd-repart.service.d/10-swtpm.conf) since the
# generator runs before systemd-modules-load.service has loaded
# tpm_vtpm_proxy, so it never detects TPM subsystem support and never wires
# this up on its own.
[Unit]
Wants=sysefi.mount
After=sysefi.mount
