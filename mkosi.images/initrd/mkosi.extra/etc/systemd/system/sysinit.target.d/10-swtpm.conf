# Statically pull in the software TPM (systemd-tpm2-generator can't do it in
# time; see systemd-tpm2-swtpm.service.d/10-esp.conf for why). A hand-placed
# symlink under sysinit.target.wants/ does not survive the build - it gets
# stripped, presumably by deb-systemd-helper reconciling .wants/ against
# packages' declared [Install] sections, which this unit doesn't have. A
# drop-in on the target itself isn't subject to that reconciliation.
[Unit]
Wants=systemd-tpm2-swtpm.service
After=systemd-tpm2-swtpm.service
