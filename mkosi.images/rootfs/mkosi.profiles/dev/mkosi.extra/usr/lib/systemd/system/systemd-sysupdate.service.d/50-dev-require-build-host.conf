[Service]
# The dev transfers pull from `mkosi serve` on the build host, which is only up
# while someone is iterating. When it's gone, skip the run (ExecCondition treats
# curl's exit 7/28 as "condition not met" -> unit skipped, not failed) instead
# of letting systemd-pull fail the service with "Could not connect to server"
# on every ~2min poll. SHA256SUMS is the manifest sysupdate itself fetches next.
ExecCondition=/usr/bin/curl --fail --silent --head --connect-timeout 5 --max-time 10 http://@BUILD_HOST@:8081/SHA256SUMS
