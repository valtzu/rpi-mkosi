[Unit]
# dev: reboot the moment an update is fully staged, instead of waiting for
# systemd-sysupdate-reboot.timer's 04:10 window. Safe because it chains off a
# *successful* run (all transfers done) - see 10-not-during-update.conf for why
# the standalone reboot timer can't be trusted mid-download.
OnSuccess=systemd-sysupdate-reboot.service
