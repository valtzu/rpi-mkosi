[Partition]
Label=root
Type=root
Format=ext4
MakeDirectories=/efi
MakeDirectories=/usr
FactoryReset=yes
CopyFiles=/usr/share/factory:/
Encrypt=tpm2
# RPi's EDK2 build does not measure anything into PCRs (see SignExpectedPcr=no
# in mkosi.conf), so binding to a PCR policy would be no more meaningful than
# no policy at all - disable it explicitly rather than rely on cryptenroll's
# default of PCR 7.
TPM2PCRs=

# This only has an effect if encryption is done build-time
#EncryptedVolume=root::cipher=xchacha20,aes-adiantum-plain64
