[Automount]
# Keep the ESP mounted once touched. gpt-auto makes it an automount with a
# ~2min idle timeout; when it expires, PID 1 runs umount() inline and blocks
# on the vfat flush to the slow dev USB stick for >14s - long enough for the
# BCM watchdog to hard-reset the board (silently, no journal entry). It also
# broke sysupdate mid-run: /boot vanished while 70-kernel.transfer wrote the UKI.
TimeoutIdleSec=0
