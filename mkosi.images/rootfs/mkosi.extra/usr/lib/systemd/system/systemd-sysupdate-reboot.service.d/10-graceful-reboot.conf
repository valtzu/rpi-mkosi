[Service]
# Reboot only when a newer version is installed AND an update isn't still
# downloading (`pending` counts a half-written version as installed - #33339).
# `pending` works offline, so this adds no extra manifest fetch; `OnSuccess=`
# from systemd-sysupdate.service already guarantees the last update completed.
ExecCondition=/bin/sh -c '! systemctl -q is-active systemd-sysupdate.service && exec /usr/lib/systemd/systemd-sysupdate pending'

# ... and give a logged-in operator a wall message + grace period instead of
# `systemd-sysupdate reboot`'s immediate logind RebootWithFlags.
ExecStart=
ExecStart=/usr/sbin/shutdown --reboot +2 "A system update was installed — rebooting into it"
