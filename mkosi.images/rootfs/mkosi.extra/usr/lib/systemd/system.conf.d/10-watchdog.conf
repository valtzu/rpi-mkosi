[Manager]
# config.txt has dtparam=watchdog=on but nothing was arming /dev/watchdog.
# 14s matches Raspberry Pi OS - the BCM2711 watchdog tops out around 15s, so
# this stays hardware-enforced (fires on a full kernel lockup, not just a
# wedged PID 1). systemd pings it every 7s while it's alive; a slow boot is
# fine. Pairs with the UKI TriesLeft= counter: a hung "latest" update -> reset
# -> the counter decrements -> rollback after 3 tries.
RuntimeWatchdogSec=14
