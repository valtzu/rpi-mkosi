# systemd-tpm2-generator already adds an order-only After=boot.mount here
# (see /run/systemd/generator/systemd-tpm2-swtpm.service.d/50-esp.conf), but
# that alone never causes boot.mount to actually be mounted - nothing else
# pulls it in eagerly since it's normally only reached via boot.automount.
# RequiresMountsFor=/boot resolves to whatever mount unit actually governs
# /boot (our replacement ../../boot.mount) and adds both Requires= and After=
# on it, which is what keeps it mounted for the system's whole lifetime.
[Unit]
RequiresMountsFor=/boot
