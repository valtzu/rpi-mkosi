# RPi4's UEFI firmware arms the SoC's BCM2835 hardware watchdog as its
# standard EFI_BOOT_SERVICES SetWatchdogTimer() implementation and hands off
# to the OS with it still running; nothing else pets it. 15s is the hardware
# maximum for this SoC (systemd silently ignores a higher value here) - this
# matches the RuntimeWatchdogSec=14 Raspberry Pi OS itself ships by default
# for the same reason.
[Manager]
RuntimeWatchdogSec=14
