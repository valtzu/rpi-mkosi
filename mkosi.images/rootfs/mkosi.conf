[Output]
Output=rootfs_%v
Format=tar
CompressOutput=no
CompressLevel=0

[Content]
WithDocs=no
Bootable=no
ExtraTrees=
    %D/mkosi.crt:/usr/lib/verity.d/mkosi.crt # sysext verification key
RemoveFiles=
    # openssh-server's postinst runs ssh-keygen -A at build time; drop the keys
    # so ssh-keygen.service regenerates them per-device on first boot and the
    # image stays byte-reproducible
    /etc/ssh/ssh_host_*
    # wall-clock-stamped by dpkg/update-alternatives during the build
    /var/log/*
    /var/cache/ldconfig
CleanPackageMetadata=no
Packages=
    acl
    bash
    bash-completion
    binutils
    ca-certificates
    coreutils
    curl
    dbus
    diffutils
    dmsetup
    dosfstools
    e2fsprogs
    fdisk
    findutils
    grep
    gzip
    iproute2
    iputils-ping
    jq
    keepalived # depends on libsnmp40t64 ?
    kexec-tools
    kmod
    less
    login
    libcryptsetup12
    mount
    mtools
    nano
    nftables
    openssh-server
    openssl
    polkitd
    python3-minimal
    rsync
    sed
    socat
    systemd
    systemd-boot
    systemd-boot-efi
    systemd-container
    systemd-resolved
    systemd-sysv
    systemd-timesyncd
    tar
    tree
    udev
    util-linux
    xz-utils
    zstd
