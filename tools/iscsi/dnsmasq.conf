# Proxy-DHCP + TFTP for netbooting the Pi into a locally served iSCSI image.
# Runs in the tools tree (which provides dnsmasq); needs privileged ports, so:
#
#   sudo mkosi box -- dnsmasq --keep-in-foreground --conf-file=tools/iscsi/dnsmasq.conf
#
# Proxy mode: your existing DHCP server (router) still hands out addresses;
# dnsmasq only adds the boot bits. Set the subnet and target IP below.

port=0                       # no DNS
log-dhcp
log-facility=-               # stderr
bind-dynamic

enable-tftp
tftp-root=mkosi.output/tftp   # must contain boot.img + boot.sig (the ESP's, signed with mkosi.key)
tftp-no-blocksize

dhcp-range=192.168.2.0,proxy  # <-- your LAN subnet

# --- Stage 1: the Pi's VideoCore bootloader ------------------------------------
# It advertises vendor class (option 60) "PXEClient:Arch:00000:UNDI:002001".
# In proxy-DHCP a matching pxe-service is required for dnsmasq to answer; the
# Pi then TFTPs boot.img / boot.sig itself (the filename here is ignored).
dhcp-match=set:rpi-fw,60,PXEClient:Arch:00000:UNDI:002001
pxe-service=tag:rpi-fw,0,"Raspberry Pi Boot",boot.img

# --- Stage 2: EDK2 (loaded from boot.img) doing iSCSI --------------------------
# arm64 UEFI advertises "PXEClient:Arch:00011:UNDI:003000". Hand it the iSCSI
# target as option 17 (root-path); EDK2 copies this into the iBFT it exposes to
# Linux. dhcp-option-force because proxy-DHCP otherwise sends only PXE options.
# NB: EDK2 still needs an iSCSI "attempt" enabled (DHCP mode) in its NVRAM /
# the RPI_EFI.fd we ship, or it won't act on this.
dhcp-match=set:rpi-uefi,60,PXEClient:Arch:00011:UNDI:003000
dhcp-option-force=tag:rpi-uefi,option:root-path,iscsi:192.168.2.2::::iqn.2026-08.lan.local:rpi-dev
