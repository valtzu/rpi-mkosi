# Proxy-DHCP + TFTP to netboot the Pi into the locally served iSCSI image.
# Runs in the tools tree (provides dnsmasq); needs privileged ports, so:
#
#   DEV_HOST=<host LAN IP> sudo mkosi box -- tools/iscsi/serve-netboot
#
# Proxy mode: your existing DHCP server (router) keeps handing out addresses;
# dnsmasq only adds the netboot bits. serve-netboot fills the "<--" lines;
# to run dnsmasq directly, edit them here first.
#
# Boot chain:
#   1. RPi bootloader HTTP-boots boot.img       (EEPROM HTTP_HOST - not here)
#   2. EDK2 does "Start PXE over IPv4" -> dnsmasq chainloads iPXE snponly.efi
#      over TFTP (Secure Boot accepts it via the enrolled iPXE cert)
#   3. iPXE re-DHCPs, tagged user-class "iPXE" -> gets script.ipxe over HTTP
#      from `mkosi serve` (:8081)
#   4. script.ipxe: sanboot the iSCSI LUN from tools/iscsi/serve-iscsi

port=0                          # no DNS
log-dhcp
log-facility=-                  # stderr
bind-dynamic
user=root                       # don't drop to "nobody" - it can't traverse $HOME to the TFTP root
# interface=eth0                # <-- uncomment/set if the host is multi-homed

enable-tftp
tftp-root=mkosi.output          # holds snponly.efi (emitted by mkosi.finalize)
tftp-no-blocksize

dhcp-range=192.168.1.0,proxy    # <-- your LAN subnet

# arm64 UEFI network boot advertises client-arch (option 93) = 11.
dhcp-match=set:armuefi,option:client-arch,11
# iPXE tags itself with user-class "iPXE" on its own (second) DHCP round.
dhcp-userclass=set:ipxe,iPXE

# EDK2's PXE (not iPXE yet): chainload iPXE over TFTP.
pxe-service=tag:armuefi,tag:!ipxe,11,"Chainload iPXE",snponly.efi
# iPXE itself: hand it the dev boot script over HTTP.
pxe-service=tag:armuefi,tag:ipxe,11,"iPXE dev boot",http://192.168.1.8:8081/script.ipxe  # <-- your host IP
