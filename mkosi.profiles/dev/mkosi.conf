# The dev profile, on top of the generic latest auto-update profile:
#  - a one-line `[Source] Path=` drop-in per sysupdate.d transfer, pointing at
#    this build host (`mkosi serve`, HTTP :8081) instead of GitHub releases
#  - zstd --fast over the split artifacts in mkosi.postoutput (the usr image is
#    mostly zeros), served as *.raw.zst / *.efi.zst
#  - defaults the boot menu to the "latest" profile (efi/loader/loader.conf)
#  - runs the update check ~1min after boot / every ~2min, and reboots as soon
#    as an update is staged (OnSuccess=) instead of the 15min / 04:10 schedule
#
# @BUILD_HOST@ in the drop-ins is filled in by mkosi.finalize from
# $SYSUPDATE_HOST, or the address mkosi.sync resolved via `hostname -I`.

[Build]
# throwaway builds: reuse the package cache once it exists instead of resyncing
# the apt index every time (mkosi.conf pins this to `never` for release builds
# because forky rotates package files out from under a stale index)
CacheOnly=auto

[Output]
# throwaway builds - skip the package changelog and its GitHub-releases diff
ManifestFormat=
