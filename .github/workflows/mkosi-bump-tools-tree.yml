name: 'Bump mkosi tools tree'

on:
  schedule:
    # Monday 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # for dispatch-workflow

jobs:
  bump:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: valtzu/gh-action-mkosi-bump@main
        with:
          bump-version: 'false'
          bump-snapshot: 'false'
          bump-tools-tree-snapshot: 'true'
          install-mkosi: 'true'
          mkosi-version: 'v27'
          commit-message: 'Bump mkosi tools tree to {{tools_tree_snapshot}}'
          skip-tag: 'true'   # no version bump here; releases are tagged by mkosi-bump.yml
          dispatch-workflow: 'mkosi.yml'   # a GITHUB_TOKEN-pushed commit doesn't start the build run
