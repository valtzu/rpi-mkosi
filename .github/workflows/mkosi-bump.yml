name: 'Weekly package release'

on:
  schedule:
    # Friday 19:00 UTC (~21:00 Europe/Helsinki). The release is published within
    # the hour; devices pull it on their next systemd-sysupdate check (every
    # 2-6h) and reboot into it at systemd-sysupdate-reboot.timer's 04:10 local,
    # so the rollout lands over the weekend nights rather than a day later.
    - cron: '0 19 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # for dispatch-workflow

jobs:
  bump:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, for the patch bump
      - name: Gate on a pure OS snapshot bump
        id: gate
        if: github.event_name == 'schedule'
        # The weekly cron only exists to ship package updates. If anything else
        # landed on main since the last release, that release wants a human to
        # review and cut it - skip the auto-release and let workflow_dispatch
        # handle it.
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match '[0-9]*')
          changed=$(git diff --name-only "$last_tag"..HEAD)
          non_snapshot=$(
            git diff --name-only "$last_tag"..HEAD -- ':!mkosi.conf'
            git diff "$last_tag"..HEAD -- mkosi.conf \
              | grep -E '^[+-][^+-]' | grep -vE '^[+-]Snapshot=' || true
          )
          if [ -z "$non_snapshot" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Weekly release skipped"
              echo "Changes since \`$last_tag\` go beyond an OS package snapshot bump:"
              echo '```'
              echo "$changed"
              echo '```'
              echo "Run this workflow manually once they have been reviewed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: valtzu/gh-action-mkosi-bump@main
        if: steps.gate.outputs.proceed != 'false'
        with:
          bump-version: 'patch'   # tag the next X.Y.(Z+1); mkosi.version is a git-describe script
          bump-snapshot: 'true'
          bump-tools-tree-snapshot: 'false'   # bumped separately, see mkosi-bump-tools-tree.yml
          install-mkosi: 'true'
          mkosi-version: 'v27'
          dispatch-workflow: 'mkosi.yml'   # a GITHUB_TOKEN-pushed tag doesn't start the release run
