# Restricts the Gemini CLI invocation in generate-changelog-summary.sh to a
# single tool call pattern: fetching one named package's changelog diff.
# Everything else (arbitrary shell, file writes, web access, ...) is denied,
# since the diff text fed to the model originates from upstream Debian
# changelogs and shouldn't be able to direct further tool use.

[[rule]]
toolName = "*"
decision = "deny"
priority = 0

[[rule]]
toolName = "run_shell_command"
commandRegex = "^bash \\.github/workflows/get-package-changelog-diff\\.sh [A-Za-z0-9][A-Za-z0-9.+-]*$"
decision = "allow"
priority = 100
