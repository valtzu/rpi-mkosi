# Opt-in dev profile: `mkosi --profile dev`. Never enabled in CI.
# Boots the Pi from a locally served iSCSI image (see tools/iscsi/).

[Match]
Profiles=dev

[Config]
PassEnvironment=DEV_HOST

[Output]
ImageVersion=dev
# No per-package changelog fetch on the dev rebuild loop (also dodges a
# transient-network failure recording the manifest).
ManifestFormat=

[Content]
# RPi4 EDK2 boots Linux via DeviceTree, so it never publishes an iBFT.
# Hand the initrd the iSCSI root explicitly instead (see the initrd dev
# profile). Portal is this host; IQNs match tools/iscsi/.
KernelCommandLine=
    rd.neednet=1
    ip=dhcp
    iscsi_portal=192.168.1.8
    iscsi_target=iqn.2026-08.lan.local:rpi-dev
    iscsi_initiator=iqn.2026-08.lan.local:rpi-dev-client
KernelModulesInitrdInclude=
    /scsi_transport_iscsi.ko
    /libiscsi.ko
    /libiscsi_tcp.ko
    /iscsi_tcp.ko
    /iscsi_ibft.ko
