[Config]
MinimumVersion=25
Profiles=disk

[Build]
CacheDirectory=mkosi.cache
BuildDirectory=mkosi.builddir
WithNetwork=yes
Incremental=yes
# forky is a fast-moving suite; with Incremental=yes, CacheOnly=auto (the
# default) skips resyncing the apt index whenever a cached image exists,
# which can leave apt working from a stale index whose package files have
# since rotated out of the mirror pool.
CacheOnly=never
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
ToolsTreePackages=
    dnsmasq # tools/iscsi: proxy-DHCP + TFTP to chainload iPXE on the Pi
    fdisk # tools/iscsi: relocate the backup GPT after padding the iSCSI LUN
    python3-pycryptodome
    qemu-efi-aarch64
    tgt # tools/iscsi: serve a built image over iSCSI for on-device testing
    unzip
    xxd
Environment=
    UEFI_VERSION=v1.42
    FIRMWARE_REF=fe200a5b779d6369c05a845c650b62d5139d17ac
    EEPROM_REF=v2026.05.17-2711-0138c0
    EEPROM_VERSION=2026-05-17

[Output]
OutputDirectory=mkosi.output
ManifestFormat=changelog

[Distribution]
Architecture=arm64
Distribution=debian
Release=forky

[Content]
BaseTrees=
    %O/rootfs_%v

[Runtime]
RuntimeSize=8G
RAM=4G
KernelCommandLineExtra=
	# slow cross-arch emulation requires increased timeouts
	systemd.default_device_timeout_sec=300
TPM=no # Raspberry Pi has no TPM either
Ephemeral=yes
Credentials=
    cryptsetup.passphrase=123
[Validation]
Checksum=no
SecureBoot=yes
SecureBootKey=%D/mkosi.key
SecureBootCertificate=%D/mkosi.crt
VerityKey=%D/mkosi.key
VerityCertificate=%D/mkosi.crt
SignExpectedPcr=no # EDK2 does not measure anything – maybe u-boot chain?
