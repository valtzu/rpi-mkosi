[Config]
MinimumVersion=25
# dev is on by default, so a bare `mkosi build`/`mkosi vm`/`mkosi serve` is
# the fast local iterate loop. CI opts out of it: `mkosi --profile=
# --profile=release ...` (the empty assignment resets the list - see mkosi's
# docs on collection-type settings).
Profiles=
    dev
Dependencies=rootfs,initrd

[Build]
CacheDirectory=mkosi.cache
BuildDirectory=mkosi.builddir
WithNetwork=yes
Incremental=yes
RepartOffline=yes
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=forky
ToolsTreeSnapshot=20260921T082148Z
ToolsTreePackages=
    python3-pycryptodome
    qemu-efi-aarch64
    systemd-journal-remote
    unzip
    xxd
Environment=
    UEFI_VERSION=v1.53
    FIRMWARE_REF=eef9c230a0e70e23a54be98f90d5237ab6e0b0fd
    EEPROM_REF=86759b04b22173e10186139ac3ae4debcd0d7252
    EEPROM_VERSION=2026-08-04
    SYSTEMD_ESP_PATH=/efi
    SYSTEMD_XBOOTLDR_PATH=/efi

[Output]
OutputDirectory=mkosi.output
ImageId=system
Output=%i_%v
CompressOutput=no
CompressLevel=0
Format=disk
SplitArtifacts=uki,partitions
SectorSize=512

[Distribution]
Architecture=arm64
Distribution=debian
Release=forky
Snapshot=20260904T203433Z

[Content]
BaseTrees=
    %O/rootfs_%v
UnifiedKernelImages=unsigned
Initrds=
    %O/initrd_%v
Packages=
    linux-image-generic
BuildPackages=
    linux-headers-generic
    build-essential
    make
    dwarves
    zstd
RemoveFiles=
    /boot/vmlinu*
Locale=C.UTF-8
Keymap=fi
Timezone=Europe/Helsinki
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImageFormat=%i_%v
KernelModulesInitrdExclude=
    .*
KernelModulesInitrdInclude=
    default
    raspberrypi
    /rpi-crypto-passphrase.ko
    /nls_cp437.ko
    /nls_ascii.ko
    /mdio-bcm-unimac.ko
    /broadcom.ko
    /spi-bcm2835.ko
    /bcm2835.ko
    /bcm2835-rng.ko
    /bcm2835_wdt.ko
    /bcm2711_thermal.ko
    /vc4.ko
    /v3d.ko
    /dwc2.ko
    /genet.ko
    /sdhci.ko
    /sdhci-pltfm.ko
    /uas.ko
    /usb-storage.ko
    /xhci-pci.ko
    /i2c-smbus.ko
    /kvm.ko
    # firmware crypto mailbox mock - inert unless loaded via rd.modules_load=
    # from an initrd and only where there is no real firmware node
    /rpi-fw-mock.ko
KernelModulesExclude=
    sound
    bluetooth
    wireless
    drivers/net/ethernet
KernelModulesInclude=
    /genet.ko
    /mdio-bcm-unimac.ko
    /broadcom.ko
    /rpi-fw-mock.ko
KernelCommandLine=
	console=ttyAMA0
	earlycon
	ipv6.disable=1
	fstab=no
	#luks.crypttab=no
	#luks.options=headless\,cipher=xchacha20\,aes-adiantum-plain64 # Does not work because cipher is harcoded in repart.c
	mount.usrflags=noatime,ro
	systemd.swap=no
	rw

[Runtime]
RuntimeSize=8G
RAM=4G
KernelCommandLineExtra=
	# slow cross-arch emulation requires increased timeouts
	systemd.default_device_timeout_sec=300
	# `mkosi vm` has no RPi firmware - load rpi-fw-mock (shipped, inert
	# otherwise) and feed it the state config.txt/the mailbox would provide.
	# rpi_fw_mock.machine_id -> DT /chosen/rpi-machine-id (the LUKS HMAC input);
	# lock_* flags take =0/=1. See rpi-fw-mock/.
	rd.modules_load=rpi-fw-mock
	rpi_fw_mock.machine_id=0123456789abcdef0123456789abcdef
	rpi_fw_mock.private_key=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
	rpi_fw_mock.lock_device_private_key=1
	rpi_fw_mock.lock_device_key_write=1
# Boot the VM device-tree-only like a real Pi (efivars.json sets the Pi UEFI to
# DT-only). Otherwise mkosi's arm64 `mkosi vm` comes up UEFI+ACPI, the kernel
# never unflattens the DT, of_chosen is NULL and rpi-fw-mock can't publish
# /chosen/rpi-machine-id. A bare `acpi=off` kernel arg only gets EDK2's stub FDT
# (no console, no disk), so disable ACPI at the QEMU level instead.
QemuArgs=-machine acpi=off
TPM=no # Raspberry Pi has no TPM either
Ephemeral=yes
Credentials=
    cryptsetup.passphrase=123
[Validation]
Checksum=no
SecureBoot=yes
SecureBootKey=%D/mkosi.key
SecureBootCertificate=%D/mkosi.crt
VerityKey=%D/mkosi.key
VerityCertificate=%D/mkosi.crt
SignExpectedPcr=no # EDK2 does not measure anything – maybe u-boot chain?
